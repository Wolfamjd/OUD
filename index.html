<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F0E2">
<title>نوتات العود</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a calm honey music-stand. Sticky bar, artist shelves on the home view, one song per view with notes flowing in columns on wide screens. */
:root{
  --bg:#F8F0E2; --surface:#FFF9EF; --card:#F1E0C1; --line:#E0C697; --line-soft:#EBDABA;
  --honey:#D9A23D; --honey-ink:#3B2410; --caramel:#B3722F; --deep:#7A461A;
  --ink:#3D2715; --soft:#86674A; --focus:#B3722F;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --notes:19px; --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1510; --surface:#251D16; --card:#30251B; --line:#4B3A29; --line-soft:#3A2D20;
  --honey:#DDA94D; --honey-ink:#24170A; --caramel:#D49655; --deep:#F0C27F;
  --ink:#F2E5D0; --soft:#B59B7D; --focus:#E8B66A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1510; --surface:#251D16; --card:#30251B; --line:#4B3A29; --line-soft:#3A2D20;
  --honey:#DDA94D; --honey-ink:#24170A; --caramel:#D49655; --deep:#F0C27F;
  --ink:#F2E5D0; --soft:#B59B7D; --focus:#E8B66A; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.6;direction:rtl;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:700;color:var(--deep);letter-spacing:0}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:42px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:0 42px 0 16px;font-size:15.5px}
.search input::placeholder{color:var(--soft)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--soft);pointer-events:none}
.iconbtn{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:19px;height:19px}

/* home */
.hero{padding-block:28px 6px}
.hero h1{font-family:var(--f-display);font-size:clamp(30px,6vw,46px);line-height:1.15;margin:0;color:var(--deep);font-weight:700;text-wrap:balance}
.hero p{margin:6px 0 0;color:var(--soft);font-size:16px;max-width:60ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-block:18px 4px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;text-decoration:none;font-weight:500;font-size:15px}
.chip span{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.chip{padding-inline-start:5px}
.chip .av{color:inherit}
/* small round avatar: monogram for a singer, line icon for a section */
.av{flex:none;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:700;line-height:1;letter-spacing:0;overflow:hidden}
.av svg{width:60%;height:60%}
.av.ph{background:var(--card);box-shadow:0 0 0 1.5px var(--line)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.credits{font-size:12px;color:var(--soft);margin:0 0 30px}
.credits summary{cursor:pointer}
.credits li{line-height:1.7}
.av.k0{background:var(--caramel);color:var(--surface)}
.av.k1{background:var(--honey);color:var(--honey-ink)}
.av.k2{background:var(--deep);color:var(--surface)}
.av.k3{background:var(--card);color:var(--deep);box-shadow:inset 0 0 0 1.5px var(--line)}
.chip .av.k0,.chip .av.k2{color:var(--surface)}
.chip .av.k1{color:var(--honey-ink)}
.chip .av.k3{color:var(--deep)}
.shelf-head h2{display:flex;align-items:center;gap:10px}
.chip:hover{border-color:var(--caramel)}
.shelf{padding-block:22px 6px}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--honey);padding-bottom:8px;margin-bottom:12px}
.shelf-head h2{font-family:var(--f-display);font-size:26px;margin:0;color:var(--deep);font-weight:700}
.shelf-head a{font-size:14px;color:var(--caramel);text-decoration:none;font-weight:500;white-space:nowrap}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.song{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line-soft);text-decoration:none;min-width:0;transition:border-color .15s,transform .15s}
.song:hover{border-color:var(--caramel)}
.song .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px;color:var(--deep);font-weight:700;font-variant-numeric:tabular-nums}
.song .t{min-width:0;flex:1}
.song .t b{display:block;font-size:16.5px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.song .t small{display:block;color:var(--soft);font-size:13px}
.empty{color:var(--soft);padding:30px 0;text-align:center}
.legend{margin-block:26px 40px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:4px 16px}
.legend summary{cursor:pointer;font-weight:700;color:var(--deep);padding-block:10px;list-style-position:inside}
.legend ul{margin:0 0 14px;padding:0 18px 0 0;display:grid;gap:8px}
.legend li{line-height:1.9}
.foot{color:var(--soft);font-size:13px;padding-block:8px 34px}

/* song view */
.crumb{display:flex;align-items:center;gap:8px;padding-block:16px 2px;font-size:14px;color:var(--soft);flex-wrap:wrap}
.crumb a{color:var(--caramel);text-decoration:none;font-weight:500}
.s-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;border-bottom:2px solid var(--honey);padding-bottom:10px}
.s-head h1{font-family:var(--f-display);font-size:clamp(30px,6vw,44px);margin:0;line-height:1.2;color:var(--deep);font-weight:700;text-wrap:balance}
.s-head .who{color:var(--soft);font-size:16px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool{height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.tool[aria-pressed="true"]{background:var(--honey);border-color:var(--caramel);color:var(--honey-ink)}
.tool svg{width:18px;height:18px}
.maqam{margin-top:14px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:8px 22px;align-items:center;background:var(--card);border-radius:var(--radius);padding:14px 16px}
.maqam b{font-size:19px;color:var(--deep);font-family:var(--f-display);font-weight:700}
.maqam .src{display:block;font-size:12.5px;color:var(--soft)}
.maqam p{margin:8px 0 0;font-size:14px;color:var(--soft)}
.scale{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.scale span{min-width:34px;height:32px;padding:0 8px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.scale span.t{background:var(--caramel);border-color:var(--caramel);color:var(--surface)}
.scale span.p{border-style:dashed;color:var(--soft)}
.scale sup,.nt sup{font-size:.6em;color:var(--caramel);margin-inline-start:1px}
.scale span.t sup{color:inherit}
.fbbox{overflow-x:auto;min-width:0}
.fb{display:block;width:100%;min-width:420px;max-width:640px;height:auto}
.fb .wood{fill:var(--line-soft)} .fb .fret{stroke:var(--line);stroke-dasharray:4 4;stroke-width:1.5}
.fb .nut,.fb .str{fill:var(--deep);stroke:var(--deep)} .fb .lbl{fill:var(--soft);font-family:var(--f-body)}
.fb .dot{fill:var(--surface);stroke:var(--caramel);stroke-width:1.6} .fb .dot.t{fill:var(--caramel)} .fb .dot.p{stroke-dasharray:3 3}
.fb .dt{fill:var(--ink);font-weight:700;font-family:var(--f-body)} .fb .dt.t{fill:var(--surface)}
.note-plain{font-size:14px;color:var(--soft);margin-top:12px}

.sheet{margin-top:18px;font-size:var(--notes);column-gap:34px;column-rule:1.5px dashed var(--line)}
.sheet.cols2{column-count:2}
.blk{margin-bottom:1.15em}
.blk h3{break-after:avoid;margin:0 0 .35em;font-size:.72em;color:var(--caramel);font-weight:700;display:flex;align-items:center;gap:8px}
.blk h3::after{content:"";flex:1;height:1px;background:var(--line)}
.blk h3 small{font-weight:400;color:var(--soft)}
.blk.sep{border-top:1px solid var(--line);padding-top:.55em}
.row{break-inside:avoid;margin-bottom:.38em}
.meta{font-size:.66em;line-height:1.35;color:var(--soft)}
.meta .cue{color:var(--caramel);font-weight:700;margin-inline-end:6px}
.nl{font-weight:700;line-height:1.75;display:flex;flex-wrap:wrap;gap:.08em .42em;align-items:center}
.nt{white-space:nowrap}
.nt.lg{background:var(--honey);color:var(--honey-ink);border-radius:.3em;padding:0 .38em}
.nt.lg sup{color:inherit}
.nt.lo{text-decoration:overline;text-decoration-color:var(--caramel);text-decoration-thickness:2.5px}
.nt.hi{text-decoration:underline;text-decoration-color:var(--caramel);text-decoration-thickness:2.5px;text-underline-offset:5px}
.lab{font-size:.62em;background:var(--caramel);color:var(--surface);border-radius:5px;padding:.1em .55em;font-weight:700}
.x{font-size:.7em;color:var(--caramel)}
.rep{break-inside:avoid;font-size:.72em;background:var(--card);color:var(--deep);border-radius:9px;padding:.35em .8em;display:inline-flex;gap:6px;align-items:center;margin-bottom:.5em}
.tipnote{margin-top:6px;border-right:3px solid var(--honey);padding:4px 12px;color:var(--soft);font-size:14.5px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:24px 40px}
.pager a{display:block;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--line-soft);background:var(--surface);text-decoration:none;min-width:0}
.pager a small{display:block;color:var(--soft);font-size:12.5px}
.pager a b{display:block;overflow-wrap:anywhere}
.pager .nx{text-align:left}

/* play mode: only the notes, big, screen kept awake */
body.play .bar,body.play .crumb,body.play .maqam,body.play .pager,body.play .tipnote,body.play .mine,body.play .srh{display:none}
body.play .s-head h1{font-size:26px}
body.play .s-head{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:8px}

@media (min-width:820px){ .sheet.auto{column-count:2} }
@media (max-width:700px){
  .maqam{grid-template-columns:minmax(0,1fr)}
  .brand b{display:none}
  .pager{grid-template-columns:minmax(0,1fr)}
  .pager .nx{text-align:right}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* rhythm & time: one practice desk (tool) on top, lessons and the four rhythms below */
.rz-hero{padding-block:22px 4px}
.rz-hero h1{font-family:var(--f-display);font-size:clamp(30px,6vw,44px);margin:0;color:var(--deep);line-height:1.2}
.rz-hero p{margin:4px 0 0;color:var(--soft);max-width:62ch}
.desk{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg>span{font-size:13.5px;color:var(--soft);min-width:64px}
.tool[disabled]{opacity:.45;cursor:not-allowed}
.tempo{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center}
.bpm{font-family:var(--f-display);font-size:clamp(54px,12vw,76px);line-height:1;color:var(--deep);font-variant-numeric:tabular-nums;text-align:center;min-width:2.6ch}
.bpm small{display:block;font-family:var(--f-body);font-size:13px;color:var(--soft);margin-top:4px}
.tempo .stack{display:grid;gap:8px}
.tempo .pm{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--caramel);height:28px}
.go{width:84px;height:84px;border-radius:50%;border:none;background:var(--caramel);color:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--deep)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--deep)}
.go svg{width:34px;height:34px}
.go[aria-pressed="true"]{background:var(--deep)}
.steps{display:flex;gap:6px;direction:rtl;justify-content:center;flex-wrap:wrap;padding:4px 0}
.cellw{display:flex;flex-direction:column;align-items:center;gap:4px}
.cell{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--soft);transition:transform .06s,background .06s;user-select:none;-webkit-user-select:none}
.cell.beat{border-color:var(--caramel)}
.cell.d{background:var(--caramel);border-color:var(--caramel);color:var(--surface)}
.cell.t{background:var(--honey);border-color:var(--honey);color:var(--honey-ink)}
.cell.now{transform:scale(1.14);box-shadow:0 0 0 4px var(--focus)}
.cell.now:not(.d):not(.t){background:var(--card);color:var(--deep)}
.cell.mute{opacity:.4}
button.cell{cursor:pointer;font:inherit;font-weight:700;font-size:18px}
.cnt{font-size:13px;color:var(--soft);font-weight:700;min-height:1.4em}
.cnt.b{color:var(--deep)}
.gapsep{width:10px}
.status{display:flex;gap:10px 18px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--soft)}
.status b{color:var(--deep);font-variant-numeric:tabular-nums}
.more{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:12px}
.opt{display:grid;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px}
.opt h4{margin:0;font-size:15px;color:var(--deep);display:flex;align-items:center;gap:8px;justify-content:space-between}
.opt p{margin:0;font-size:13.5px;color:var(--soft)}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:right .15s}
.sw input:checked+i{background:var(--caramel)}
.sw input:checked+i::after{right:21px}
.sw input:focus-visible+i{outline:2.5px solid var(--focus);outline-offset:2px}
.nums{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.nums select{font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;height:36px;padding:0 8px}
.r-h2{font-family:var(--f-display);font-size:26px;color:var(--deep);margin:30px 0 10px;border-bottom:2px solid var(--honey);padding-bottom:6px}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px;display:grid;gap:10px;align-content:start}
.rcard h3{margin:0;font-family:var(--f-display);font-size:23px;color:var(--deep);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rcard h3 small{font-family:var(--f-body);font-size:13px;color:var(--soft);font-weight:500}
.rcard p{margin:0;font-size:14.5px}
.rcard .tag{font-size:12px;background:var(--card);color:var(--deep);border-radius:6px;padding:2px 8px;font-weight:700}
.mini-steps{display:flex;gap:4px;direction:rtl}
.mini-steps i{flex:1;height:30px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px;color:var(--soft)}
.mini-steps i.d{background:var(--caramel);border-color:var(--caramel);color:var(--surface)}
.mini-steps i.t{background:var(--honey);border-color:var(--honey);color:var(--honey-ink)}
.mini-steps i.b{border-color:var(--caramel)}
.lessons{display:grid;gap:10px}
.lesson{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:2px 16px}
.lesson summary{cursor:pointer;font-weight:700;color:var(--deep);padding-block:12px;font-size:17px;list-style-position:inside}
.lesson summary small{color:var(--soft);font-weight:400;font-size:13px;margin-inline-start:6px}
.lesson .in{padding-bottom:14px;display:grid;gap:10px}
.lesson p,.lesson li{margin:0;font-size:15px;line-height:1.85}
.lesson ul,.lesson ol{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.lesson table{border-collapse:collapse;width:100%;font-size:14.5px}
.lesson td,.lesson th{border-bottom:1px solid var(--line-soft);padding:6px 4px;text-align:right}
.lesson th{color:var(--soft);font-weight:500;font-size:13px}
.dur{display:grid;gap:6px}
.dur div{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center;font-size:14.5px}
.dur .bar4{display:grid;grid-template-columns:repeat(16,1fr);gap:2px}
.dur .bar4 i{height:16px;border-radius:4px;background:var(--line-soft)}
.dur .bar4 i.on{background:var(--caramel)}
.dur .bar4 i.s{background:var(--honey)}
.callout{background:var(--card);border-radius:12px;padding:10px 14px;font-size:14.5px}
.homecta{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px 16px;border-radius:var(--radius);background:var(--card);text-decoration:none;border:1px solid var(--line)}
.homecta svg{width:40px;height:40px;flex:none;color:var(--deep)}
.homecta b{display:block;font-size:17px;color:var(--deep)}
.homecta small{color:var(--soft);font-size:13.5px}
#mini{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:20;display:none;align-items:center;gap:6px;background:var(--deep);color:var(--surface);border-radius:999px;padding:6px 8px 6px 14px;box-shadow:0 6px 20px rgba(0,0,0,.22);font-weight:700}
#mini.show{display:flex}
#mini button{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:inherit;cursor:pointer;font:inherit;font-weight:700;display:grid;place-items:center}
#mini a{color:inherit;text-decoration:none;font-variant-numeric:tabular-nums;padding:0 4px}
#mini .dot{width:10px;height:10px;border-radius:50%;background:var(--honey);opacity:.35}
#mini .dot.on{opacity:1}
/* tuner: wood body, brass plate, paper tape that slides under a red line, cents strip, rolling Hz counter */
.tun{margin-top:14px;max-width:820px;margin-inline:auto;display:grid;gap:14px}
.tbody{position:relative;border-radius:26px;padding:18px 14px 16px;
  background:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.18),transparent 60%),repeating-linear-gradient(92deg,rgba(0,0,0,.06) 0 3px,transparent 3px 9px),linear-gradient(180deg,#9A5A2A,#6E3B17);
  box-shadow:0 10px 24px rgba(60,30,10,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.tplate{position:relative;border-radius:18px;padding:14px 14px 12px;background:linear-gradient(180deg,#F2D489,#C99B43 55%,#E7C676);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.3)}
.tplate .scr{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF2C6,#9B7428);box-shadow:0 1px 1px rgba(0,0,0,.4)}
.tplate .scr::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:1.3px;background:rgba(80,50,10,.6);transform:rotate(-30deg)}
.tmeter{position:relative;height:26px;border-radius:7px 7px 0 0;background:#3E3A36;overflow:hidden;direction:ltr;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.tmeter .scale{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1.5px,transparent 1.5px 10%);background-position:calc(50% - .75px) 0;opacity:.55;
  -webkit-mask:linear-gradient(#000,#000) top/100% 30% no-repeat,linear-gradient(#000,#000) bottom/100% 30% no-repeat;mask:linear-gradient(#000,#000) top/100% 30% no-repeat,linear-gradient(#000,#000) bottom/100% 30% no-repeat}
.tmeter .zone{position:absolute;top:0;bottom:0;background:rgba(80,190,110,.28)}
.tmeter .fill{position:absolute;top:3px;bottom:3px;background:linear-gradient(180deg,#F08D6B,#D0563A);border-radius:3px;opacity:.9}
.tmeter .dia{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;background:#FFF;transform:rotate(45deg);box-shadow:0 0 0 1.5px rgba(0,0,0,.3)}
.tmeter .lab{position:absolute;top:4px;font:700 11px/1 var(--f-body);color:#EEE;opacity:.8}
.tmeter.ok .fill{background:linear-gradient(180deg,#7FD49A,#36A35A)}
.tmeter.dim .dia,.tmeter.dim .fill{opacity:.25}
.tmeter.held .dia,.tmeter.held .fill{opacity:.6}
.ttapebox{position:relative;height:150px;border-radius:0 0 8px 8px;overflow:hidden;background:linear-gradient(180deg,#E7DDCB,#FFFDF6 18%,#FFFDF6 82%,#E2D7C3);box-shadow:inset 0 6px 10px -6px rgba(0,0,0,.45),inset 0 -6px 10px -6px rgba(0,0,0,.45)}
.ttapebox canvas{position:absolute;inset:0;width:100%;height:100%}
.ttapebox .rl{position:absolute;top:-30px;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:linear-gradient(90deg,#B01C14,#F0453A,#B01C14);z-index:2;box-shadow:0 0 4px rgba(200,30,20,.5)}
.ttapebox::before,.ttapebox::after{content:"";position:absolute;top:0;bottom:0;width:18%;z-index:1;pointer-events:none}
.ttapebox::before{left:0;background:linear-gradient(90deg,rgba(120,80,40,.35),transparent)}
.ttapebox::after{right:0;background:linear-gradient(270deg,rgba(120,80,40,.35),transparent)}
.tmeterwrap{position:relative}
.tmeterwrap .rl2{position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:#E0352B;z-index:3}
.todo{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;direction:ltr}
.odo{display:flex;align-items:center;gap:3px;padding:5px 6px;border-radius:8px;background:linear-gradient(180deg,#C9A45A,#E9CF8C);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.odc{width:24px;height:34px;overflow:hidden;border-radius:4px;background:linear-gradient(180deg,#D8D2C6,#FFF 35%,#FFF 65%,#CFC8BA);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.odr{display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.odr i{height:34px;display:grid;place-items:center;font:700 22px/1 Georgia,"Times New Roman",serif;font-style:normal;color:#2B2018}
.odo .dot{font:700 22px/1 Georgia,serif;color:#2B2018;margin:0 1px}
.todo .unit{font:700 20px/1 Georgia,serif;color:#F7E2B4;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.tname{margin:12px auto 0;width:max-content;max-width:100%;padding:6px 22px;border-radius:10px;background:linear-gradient(180deg,#F2D489,#C99B43 60%,#E7C676);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 4px rgba(0,0,0,.35);font-family:var(--f-display);font-size:19px;color:#5A3412}
.tmsg{text-align:center;font-weight:700;font-size:19px;color:var(--deep);min-height:1.6em}
.tmsg.ok{color:#2E9B4F}
.tlev{position:relative;width:100%;height:8px;border-radius:5px;background:var(--line);max-width:260px;margin:-6px auto 0;overflow:hidden}
.tlev i{position:absolute;inset:0 auto 0 0;width:0;background:var(--soft);border-radius:5px;transition:width .06s linear}
.tlev.on i{background:#2E9B4F}
.tlev b{position:absolute;top:0;bottom:0;width:2px;background:var(--deep);opacity:.55}
.tmicw[hidden]{display:none}
.tlev{cursor:pointer}
.tdbg{margin:0 auto;max-width:340px;white-space:pre-wrap;font:12px/1.6 ui-monospace,Consolas,monospace;direction:rtl;text-align:center;color:var(--soft);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:6px 8px}
.tmicw{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--soft)}
.tmicw select{height:36px;max-width:260px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;font:inherit;padding:0 8px}
.tstr{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tstr.five{grid-template-columns:repeat(5,1fr)}
.tstr button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 2px;cursor:pointer;display:grid;gap:2px;justify-items:center;font:inherit}
.tstr button b{font-size:17px;color:var(--deep)}
.tstr button small{font-size:11px;color:var(--soft);direction:ltr}
.tstr button[aria-pressed="true"]{background:var(--honey);border-color:var(--caramel)}
.tstr button.hit{box-shadow:0 0 0 3px var(--focus)}
.tstr button.done b::after{content:" ✓";color:#2E9B4F;font-size:13px}
.tset{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden}
.tset h3{margin:0;padding:12px 16px 6px;font-size:15px;color:var(--soft);font-weight:500}
.srow{border-top:1px solid var(--line-soft)}
.srow summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 16px}
.srow summary::-webkit-details-marker{display:none}
.srow summary span{flex:1;min-width:0}
.srow summary b{display:block;font-size:16px;font-weight:500}
.srow summary small{color:var(--soft);font-size:13.5px}
.srow summary i{font-style:normal;color:var(--soft);font-size:20px;transition:transform .2s}
.srow[open] summary i{transform:rotate(-90deg)}
.sopt{padding:2px 16px 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sopt .val{min-width:96px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;color:var(--deep)}
@media (max-width:560px){.ttapebox{height:126px}.odc{width:20px;height:30px}.odr i{height:30px;font-size:19px}}
/* per-song rhythm strip, my status, filters, practice page */
.srh{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:grid;gap:10px}
.srh .top{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.srh .top .what{flex:1;min-width:200px;font-size:15px}
.srh .top .what b{color:var(--deep);font-size:17px}
.srh .top .what small{color:var(--soft)}
.srh .ed{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.srh input[type=number]{width:84px;height:38px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);text-align:center;font-weight:700;font-size:16px}
.mine{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;margin-inline-start:6px;vertical-align:middle;background:var(--card);color:var(--deep)}
.badge.know{background:var(--caramel);color:var(--surface)}
.fav{color:var(--caramel)}
.ctas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px;margin-top:16px}
.ctas .homecta{margin-top:0}
.filters{margin-top:14px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:2px 14px}
.filters summary{cursor:pointer;font-weight:700;color:var(--deep);padding-block:10px}
.filters summary small{color:var(--caramel);font-weight:700}
.filters .in{display:grid;gap:10px;padding-bottom:12px}
.filters .seg>span{min-width:58px}
.filters .tool{height:34px;font-size:14px;padding:0 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:34px;color:var(--deep);line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--soft);font-size:13.5px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:120px;margin-top:12px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:12px 12px 6px}
.days div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:10.5px;color:var(--soft)}
.days i{display:block;width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:var(--caramel);min-height:3px}
.days i.z{background:var(--line-soft)}
.when{color:var(--soft);font-size:12.5px}
.xfer textarea{width:100%;min-height:80px;font:12px/1.4 ui-monospace,monospace;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px;direction:ltr}
@media (max-width:560px){
  .tempo{grid-template-columns:1fr auto}
  .tempo .stack{grid-column:1/-1;order:3}
  .steps{gap:4px;flex-wrap:nowrap}
  .steps.wrap{flex-wrap:wrap}
  .steps:not(.wrap) .cellw{flex:1 1 0;min-width:0}
  .cell{width:38px;height:38px;font-size:16px}
  .steps:not(.wrap) .cell{width:100%;max-width:46px;height:auto;aspect-ratio:1}
  .dur div{grid-template-columns:92px 1fr}
}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>

function split(tok){let a='';if(tok.endsWith('#½')){a='½♯';tok=tok.slice(0,-2)}else if(tok.endsWith('½')){a='½♭';tok=tok.slice(0,-1)}else if(tok.endsWith('b')){a='♭';tok=tok.slice(0,-1)}else if(tok.endsWith('#')){a='♯';tok=tok.slice(0,-1)}return [AR[tok]||tok,a]}
const noteName=t=>{const [n,a]=split(t);return `${n}${a?`<sup>${a}</sup>`:''}`};

function fretboard(fb){
  const NUT=585,STEP=118,Y0=32,DY=38,OPEN=['فا','لا','ري','صول','دو'];
  const X=f=>f==0?NUT+32:NUT-f*STEP+STEP/2-6, Y=n=>Y0+(n-1)*DY;
  let o=`<svg class="fb" viewBox="30 0 690 232" role="img" aria-label="أماكن نغمات المقام على أوتار العود">`;
  o+=`<rect class="wood" x="40" y="${Y0-16}" width="${NUT-40}" height="${4*DY+32}" rx="8"/>`;
  for(let f=1;f<=4;f++){const x=NUT-f*STEP;o+=`<line class="fret" x1="${x}" y1="${Y0-16}" x2="${x}" y2="${Y0+4*DY+16}"/><text class="lbl" x="${x+STEP/2-6}" y="${Y0+4*DY+40}" text-anchor="middle" font-size="17">موضع ${f}</text>`}
  o+=`<rect class="nut" x="${NUT-4}" y="${Y0-18}" width="8" height="${4*DY+36}" rx="3"/><text class="lbl" x="${NUT+30}" y="${Y0+4*DY+40}" text-anchor="middle" font-size="17">مفتوح</text>`;
  for(let n=1;n<=5;n++){o+=`<line class="str" x1="40" y1="${Y(n)}" x2="${NUT+52}" y2="${Y(n)}" stroke-width="${3.4-n*0.45}"/><text class="lbl" x="${NUT+132}" y="${Y(n)+6}" font-size="17" text-anchor="start" direction="rtl">وتر ${n} · ${OPEN[n-1]}</text>`}
  fb.forEach(([n,f,tok,k])=>{const [t,a]=split(tok);const c=k=='t'?' t':k=='p'?' p':'';
    o+=`<circle class="dot${c}" cx="${X(f)}" cy="${Y(n)}" r="17.5"/><text class="dt${k=='t'?' t':''}" x="${X(f)}" y="${Y(n)+5.5}" text-anchor="middle" font-size="${a?13:t=='صول'?14:17}" direction="rtl">${t}${a}</text>`});
  return o+`</svg>`;
}

function rowHtml(r){
  let meta='';
  if(r.cue)meta+=`<span class="cue">${esc(r.cue)}</span>`;
  if(r.ann)meta+=`<span>${esc(r.ann)}</span>`;
  const notes=(r.items||[]).map(i=>{
    if(i.t=='label')return `<span class="lab">${esc(i.v)}</span>`;
    if(i.t=='rep')return `<span class="x">× ${esc(i.v||2)}</span>`;
    if(i.t=='sep')return `<span class="x">|</span>`;
    if(i.t=='rest')return `<span class="x">(سكتة)</span>`;
    const c=['nt',i.l?'lg':'',i.o=='low'?'lo':i.o=='high'?'hi':''].filter(Boolean).join(' ');
    return `<span class="${c}">${esc(i.n)}${i.a?`<sup>${esc(i.a)}</sup>`:''}</span>`;
  }).join('');
  if(!meta&&!notes)return '';
  return `<div class="row">${meta?`<div class="meta">${meta}</div>`:''}${notes?`<div class="nl">${notes}</div>`:''}</div>`;
}
function sheetHtml(s){
  return s.blocks.map((b,k)=>{
    if(b.repeat)return `<div class="blk"><span class="rep">↻ أعد المقطع: ${esc(b.repeat)}</span></div>`;
    const head=b.name?`<h3>${esc(b.name)}${b.note?` <small>${esc(b.note)}</small>`:''}</h3>`:'';
    return `<div class="blk${!b.name&&k?' sep':''}">${head}${b.rows.map(rowHtml).join('')}</div>`;
  }).join('');
}

}

/* ───────── rhythm & time: engine (Web Audio lookahead scheduler) ───────── */
// Patterns are 8 eighth-note slots of a 4/4 bar: D = دم, T = تك, . = سكتة (إس)
const RH={
  wahda:{name:'الوحدة',sig:'4/4',p:'D..T..T.',bpm:80,src:'MaqamWorld'},
  maqsum:{name:'المقسوم',sig:'4/4',p:'DT.TD.T.',bpm:100,src:'MaqamWorld'},
  rumba:{name:'الرومبا',sig:'4/4',p:'D..T..D.',bpm:96,src:'MaqamWorld'},
  khaleeji:{name:'الرومبا بنَفَس خليجي',sig:'4/4',p:'D..D..T.',bpm:76,src:'Babayaga'},
  arabi:{name:'العربي',sig:'4/4',p:'D...T...',bpm:80,src:'',tent:true},
  custom:{name:'إيقاعي الخاص',sig:'4/4',p:'D...T.T.',bpm:90,src:''}

const METERS={'2/4':{beats:2},'3/4':{beats:3},'4/4':{beats:4},'6/8':{beats:2,six:true}};
const S=Object.assign({mode:'metro',bpm:80,meter:'4/4',sub:1,acc:true,rh:'maqsum',vol:.8,click:false,countIn:false,timer:0,
  tr:false,trInc:5,trEvery:4,trTarget:120,gap:false,gapPlay:2,gapMute:2},store.get('rz',{}));
RH.custom.p=store.get('rz-custom',RH.custom.p);RH.arabi.p=store.get('rz-arabi',RH.arabi.p);
const saveS=()=>{const {running,...k}=S;store.set('rz',k)};
const E={ctx:null,out:null,noise:null,on:false,timer:null,next:0,step:0,bar:0,q:[],raf:0,t0:0,cur:-1,muted:false,cin:false,endAt:0};
const tempoName=b=>b<60?'بطيء جداً':b<76?'بطيء':b<108?'معتدل':b<168?'سريع':'سريع جداً';
function audio(){
  if(!E.ctx){const C=window.AudioContext||window.webkitAudioContext;E.ctx=new C();E.out=E.ctx.createGain();E.out.connect(E.ctx.destination);
    const n=E.ctx.createBuffer(1,E.ctx.sampleRate*.3,E.ctx.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;E.noise=n}

}
function envG(t,peak,dec){const g=E.ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+dec);g.connect(E.out);return g}
function click(kind,t){const o=E.ctx.createOscillator();o.type='triangle';o.frequency.value=kind=='acc'?1760:kind=='beat'?1250:900;
  o.connect(envG(t,kind=='acc'?.9:kind=='beat'?.55:.22,.05));o.start(t);o.stop(t+.07)}
function dum(t){const o=E.ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(52,t+.22);
  o.connect(envG(t,1,.45));o.start(t);o.stop(t+.5);

  const o=E.ctx.createOscillator();o.type='triangle';o.frequency.value=1150;o.connect(envG(t,.18,.035));o.start(t);o.stop(t+.05)}
function layout(){ // -> {n steps per bar, per steps per beat, dur seconds per step, pat?}

function tick(){

  if(done===true&&E.ctx){const t=E.ctx.currentTime+.05;[0,.18,.36].forEach((d,i)=>{const o=E.ctx.createOscillator();o.type='sine';o.frequency.value=[880,1108,1318][i];o.connect(envG(t+d,.5,.5));o.start(t+d);o.stop(t+d+.55)})}

const setBpm=v=>{S.bpm=Math.max(30,Math.min(240,Math.round(v)));saveS();syncTempoUI()};

const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const todayMin=()=>Math.round((store.get('rz-log',{})[new Date().toISOString().slice(0,10)]||0)+(E.on?(Date.now()-E.t0)/60000:0));
const CH={D:'د',T:'ت','.':'·'};
function countLabels(L){ // what you say out loud for each slot
  const out=[];for(let i=0;i<L.n;i++){const b=Math.floor(i/L.per)+1,k=i%L.per;
    out.push(k==0?String(b):L.per==2?'و':L.per==3?(k==1?'تا':'تي'):L.per==4?['','ي','و','ا'][k]:'')}
  return out;
}
function stepsHtml(){

    const c=L.pat?L.pat[i]:'.',cls=['cell',i%L.per==0?'beat':'',c=='D'?'d':c=='T'?'t':''].filter(Boolean).join(' ');
    const lab=L.pat?CH[c]:(i%L.per==0?(i==0&&S.acc&&!L.pat?'●':'○'):'·');
    h+=`<span class="cellw">${edit?`<button type="button" class="${cls}" data-i="${i}" aria-label="الخانة ${i+1}: ${c=='D'?'دم':c=='T'?'تك':'سكتة'}">${lab}</button>`:`<span class="${cls}" data-i="${i}">${lab}</span>`}<span class="cnt${i%L.per==0?' b':''}">${cnt[i]}</span></span>`;

function bindDesk(){
  const root=document.getElementById('desk');
  root.onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.id=='go')return toggleRz();
    if(b.dataset.d)return setBpm(S.bpm+ +b.dataset.d);
    if(b.id=='tap'){const n=performance.now();E.taps=(E.taps||[]).filter(x=>n-x<2500);E.taps.push(n);
      if(E.taps.length>1){const iv=(E.taps[E.taps.length-1]-E.taps[0])/(E.taps.length-1);setBpm(60000/iv)}return}
    if(b.dataset.i!==undefined&&(S.rh=='custom'||S.rh=='arabi')&&S.mode=='rhythm'){
      const r=RH[S.rh],i=+b.dataset.i,nx={'.':'D',D:'T',T:'.'}[r.p[i]];r.p=r.p.slice(0,i)+nx+r.p.slice(i+1);store.set('rz-'+S.rh,r.p);
      document.getElementById('steps').innerHTML=stepsHtml();return}
    for(const k of ['mode','meter','sub','rh','timer']){if(b.dataset[k]!==undefined){
      let v=b.dataset[k];if(k=='sub'||k=='timer')v=+v;
      if(k=='rh'&&S.rh!==v)S.bpm=RH[v].bpm;
      S[k]=v;saveS();if(E.on&&k!='timer'){E.step=0}
      if(k=='timer'&&E.on)E.endAt=v?E.t0+v*60000:0;
      renderDesk();return}}
  };
  root.oninput=e=>{const t=e.target;
    if(t.id=='bpmr')setBpm(+t.value);
    if(t.id=='vol'){S.vol=+t.value;if(E.out)E.out.gain.value=S.vol;saveS()}};
  root.onchange=e=>{const t=e.target;
    const map={acc:'acc',clk:'click',cin:'countIn',tr:'tr',gap:'gap'};
    if(map[t.id]){S[map[t.id]]=t.checked;if(t.id=='gap'&&!t.checked)E.muted=false;saveS()}
    if(['trInc','trEvery','trTarget','gapPlay','gapMute'].includes(t.id)){S[t.id]=+t.value;saveS()}
    if(t.id=='acc')document.getElementById('steps').innerHTML=stepsHtml();};
}

  <div class="lessons">

     <p>ما تعرف سرعة أغنية؟ شغّلها واضغط «انقر السرعة» مع النبض 4 مرات أو أكثر، والأداة تحسبها.</p>

     <p><b>الميزان</b> رقمين فوق بعض: الرقم <b>الأعلى</b> كم نبضة في المازورة، والرقم <b>الأسفل</b> نوع النبضة (4 = سوداء، 8 = كروش).</p>

     <div class="dur">

       ${durRow('البيضاء',[0,1,2,3,4,5,6,7],'نبضتين')}

     <p>وكل طول له <b>سكتة</b> بنفس المدة: وقت تسكت فيه وأنت مستمر تعدّ.</p>

     <p>للأسرع قسّم أكثر: <b>١ ي و ا ٢ ي و ا</b> (أرباع). في الأداة اختر «التقسيم» عشان تسمع هالأجزاء وتشوفها.</p>

function analyse(s){
  const ns=[];s.blocks.forEach(b=>(b.rows||[]).forEach(r=>(r.items||[]).forEach(i=>{if(i.t=='note')ns.push(i)})));
  const ORD=['دو','ري','مي','فا','صول','لا','سي'];const set=new Map();
  ns.forEach(i=>String(i.n).split('+').forEach(n=>{const k=n+(i.a||'');if(!set.has(k))set.set(k,{n,a:i.a||''})}));
  s.used=[...set.values()].sort((x,y)=>ORD.indexOf(x.n)-ORD.indexOf(y.n));
  const qt=ns.filter(i=>(i.a||'').includes('½')).length,oct=ns.filter(i=>i.o).length;
  let sc=0;if(ns.length>110)sc++;if(ns.length>240)sc++;if(set.size>9)sc++;if(qt)sc++;if(oct>3)sc++;
  s.diff=sc<=1?'سهلة':sc==2?'متوسطة':'صعبة';
  const FAM=['نهاوند','بيات','راست','صبا','عجم','كرد','حجاز','سيكا'],nm=s.maqam&&s.maqam.name||'';
  const f=FAM.find(f=>nm.includes(f));s.fam=f?(f=='بيات'?'بياتي':f):'غير محدد';
}

   <div class="sopt"><button class="tool" type="button" data-pa="edit">✎ عدّل «${esc(p.name)}»</button><button class="tool" type="button" data-pa="new">+ بروفايل جديد</button><button class="tool" type="button" data-pa="dup">نسخة منه</button>${PROFILES.length>1?'<button class="tool" type="button" data-pa="del">حذف</button>':''}<button class="tool" type="button" data-pa="reset">رجّع الأصلية</button></div>`;
  if(edit){
    h+=`<div class="sopt pedit" style="display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:12px">
      <label style="display:flex;gap:8px;align-items:center">الاسم <input id="pname" value="${esc(p.name)}" style="flex:1;height:38px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;font:inherit;color:inherit"></label>
      <small style="color:var(--soft)">الأوتار من الأغلظ للأرفع. اكتب الاسم والتردد بالهرتز، أو اختر النغمة يحسبها من «لا» = ${T.a4.toFixed(1)}.</small>
      <div id="prows" style="display:grid;gap:6px">${p.str.map((s,i)=>prow(s,i)).join('')}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="tool" type="button" data-pa="addstr">+ وتر</button><button class="tool" type="button" data-pa="save" style="background:var(--honey);border-color:var(--caramel);color:var(--honey-ink)">احفظ</button><button class="tool" type="button" data-pa="cancel">إلغاء</button></div>
    </div>`;
  }
  return h+'</section>';
}
const inp='height:38px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font:inherit;color:inherit;padding:0 8px;min-width:0';
const prow=(s,i)=>`<div class="prow" style="display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px">
  <input class="pl" value="${esc(s.l)}" placeholder="اسم الوتر" aria-label="اسم الوتر ${i+1}" style="${inp}">
  <input class="ph" type="number" step="0.1" min="20" max="2000" value="${s.hz}" aria-label="التردد" inputmode="decimal" style="${inp};direction:ltr;text-align:center">
  <select class="pn" aria-label="احسب من نغمة" style="${inp}">${pickNotes()}</select>
  <button class="tool" type="button" data-pa="rm" aria-label="احذف الوتر">×</button></div>`;
function tsetHtml(){
  const v=setVal(),row=(k,title,body)=>`<details class="srow" data-k="${k}"><summary><span><b>${title}</b><small id="tv-${k}">${esc(v[k])}</small></span><i>‹</i></summary><div class="sopt">${body}</div></details>`;
  const opt=(k,pairs)=>pairs.map(([val,l])=>`<button class="tool" type="button" data-set="${k}" data-v="${val}" aria-pressed="${String(T[k])===String(val)}">${l}</button>`).join('');
  return `<section class="tset" aria-label="إعدادات الدوزان"><h3>الإعدادات</h3>
   ${row('sens','حساسية المايك',opt('sens',[['hi','عالية'],['mid','متوسطة'],['lo','منخفضة']])+'<small style="color:var(--soft);width:100%">«عالية» تلقط الصوت الخفيف ومايك السماعة البعيد. لو المكان فيه إزعاج (مكيف، كلام) والقراءة تقفز، خلّها «متوسطة» أو «منخفضة».</small>')}
   ${row('a4','تردد «لا» المرجعي',`<button class="tool" type="button" data-a4="-1">−1</button><button class="tool" type="button" data-a4="-0.1">−0.1</button><span class="val" id="a4v">${T.a4.toFixed(1)}</span><button class="tool" type="button" data-a4="0.1">+0.1</button><button class="tool" type="button" data-a4="1">+1</button><button class="tool" type="button" data-a4="reset">440</button><small style="color:var(--soft);width:100%">من 390 إلى 500 هرتز.</small>`)}
   ${row('names','كتابة النغمات',opt('names',[['ar','دو ري مي'],['solf','Do Re Mi'],['en','C D E']]))}
   ${row('order','ترتيب النغمات',opt('order',[['lh','من الغليظ للحاد'],['hl','من الحاد للغليظ']]))}
   ${row('acc','دييز أو بيمول',opt('acc',[['f','♭ بيمول'],['s','♯ دييز']]))}
   ${row('tr','التحويل (Transpose)',`<button class="tool" type="button" data-tr="-1">−</button><span class="val" id="trv">${v.tr}</span><button class="tool" type="button" data-tr="1">+</button><button class="tool" type="button" data-tr="0">بدون</button><small style="color:var(--soft);width:100%">يعرض النغمة مزاحة بأنصاف تون، لو عودك أو الآلة اللي معك على درجة ثانية.</small>`)}
   ${row('tol','السماحية',opt('tol',[1,2,3,5,10,15,20].map(x=>[x,'±'+x]))+'<small style="color:var(--soft);width:100%">كم سنت يعتبره «مضبوط». 5 مناسب للعود.</small>')}
   ${row('tkey','مفتاح نظام الضبط',opt('tkey',[...Array(12)].map((_,i)=>[i,NAMES[T.names][T.acc][i]])))}
   ${row('temp','نظام الضبط',opt('temp',Object.keys(TEMPS).map(k=>[k,TEMPS[k].name]))+'<small style="color:var(--soft);width:100%">«متساوي» هو المستخدم عادة. الأنظمة الثانية تضبط كل نغمة بنسبتها الطبيعية من المفتاح.</small>')}
  </section>`;
}
let PEDIT=false;
function tunerPage(){
  const P=curP(),SS=P.str;
  const mOf=h=>69+12*Math.log2(h/T.a4);
  if(!TV.live&&SS.length){TV.pos=TV.tgt=Math.round(mOf(SS[SS.length-1].hz))+T.tr}
  app.innerHTML=`<div class="crumb"><a href="#">الرئيسية</a> ‹ <span>دوزان العود</span></div>
  <section class="rz-hero"><h1>دوزان العود</h1><p>شغّل المايك، واعزف وتر واحد واتركه يرن. لما توقف النغمة على الخط الأحمر ويخضرّ الشريط، الوتر مضبوط.</p></section>
  <div class="tun">
    <div class="tbody"><div class="tplate"><i class="scr" style="top:6px;right:6px"></i><i class="scr" style="top:6px;left:6px"></i><i class="scr" style="bottom:6px;right:6px"></i><i class="scr" style="bottom:6px;left:6px"></i>
      <div class="tmeterwrap"><div class="tmeter" id="tmeter"><div class="scale"></div><div class="zone" style="left:${50-T.tol}%;width:${2*T.tol}%"></div><div class="fill"></div><div class="dia"></div><span class="lab" style="left:6px">−50</span><span class="lab" style="right:6px">+50</span></div></div>
      <div class="ttapebox"><canvas id="ttape" aria-hidden="true"></canvas><div class="rl"></div></div>
      </div>
      <div class="todo"><div class="odo" id="todo">${[0,1,2,3,4].map(i=>`${i==4?'<b class="dot">.</b>':''}<span class="odc"><span class="odr">${[...Array(10)].map((_,d)=>`<i>${d}</i>`).join('')}</span></span>`).join('')}</div><span class="unit">Hz</span></div>
      <div class="tname">${esc(P.name)}</div>
    </div>
    <div class="tmsg" id="tmsg" role="status">اضغط المايك عشان تبدأ</div>
    <div class="tlev" id="tlev" title="اضغط لعرض الفحص"><i></i><b></b></div>
    <pre class="tdbg" id="tdbg" hidden></pre>
    <div style="display:flex;justify-content:center"><button class="go" id="tgo" type="button" aria-pressed="false"></button></div>
    <label class="tmicw" hidden>المايك <select id="tmic" aria-label="اختر المايك"></select></label>
    <div class="tstr" id="tstr" role="group" aria-label="الأوتار من الأغلظ للأرفع" style="grid-template-columns:repeat(${Math.max(1,SS.length)},1fr)">${SS.map((s,i)=>`<button type="button" data-s="${i}" aria-pressed="${T.lock===i}"><b>${esc(s.l)}</b><small>${s.hz.toFixed(1)}</small></button>`).join('')}</div>
    <p style="margin:-4px 0 0;font-size:13px;color:var(--soft);text-align:center">الأوتار من الأغلظ (يمين) للأرفع، والرقم تحت كل وتر تردده بالهرتز. اضغط وتر: يثبّت عليه ويسمّعك نغمته.</p>
    <div id="profbox">${profHtml(PEDIT)}</div>
    ${tsetHtml()}
    <details class="lesson"><summary>نصايح للدوزان</summary><div class="in"><ul>
      <li>ابدأ من وتر وانتقل للي بعده، وكل ما خلصت ارجع شيّك على الكل: شد وتر يأثر على الباقي.</li>
      <li>لو الوتر أوطى بكثير، شدّه فوق النغمة شوي ثم ارجع له: الأوتار الجديدة ترتخي بسرعة.</li>
      <li>اعزف بالريشة بنص القوة، وخلّ العود قريب من المايك، وابعد عن صوت المكيف والتلفزيون.</li>
      <li>لو تستخدم مايك سماعة (مثل HyperX Cloud): قرّب العود من الكمبيوتر ووجّه ذراع المايك لفتحة العود على بعد شبر تقريبًا، وتأكد إن زر كتم المايك طافي. في ويندوز ارفع مستوى المايك (إعدادات الصوت ← الإدخال)، وطفّ إلغاء الضوضاء في برنامج السماعة (NGENUITY) لأنه يقص صوت العود. الشريط الصغير تحت الرسالة يبين لك إن المايك سامعك: يخضرّ لما الصوت كافي.</li>
      <li>العود مزدوج الأوتار: اضبط كل وتر من الزوج لوحده، ثم اعزفهم مع بعض: لو تسمع «تموّج» في الصوت، واحد منهم مو مضبوط.</li></ul></div></details>
  </div>
  <p class="foot" style="margin-top:14px">الكشف بطريقة McLeod (MPM) نفس مكتبة pitchy المفتوحة، ويشتغل كله داخل جهازك: الصوت ما يطلع لأي مكان. البروفايلات محفوظة في هالجهاز.</p>`;
  document.title='دوزان العود · نوتات العود';
  tunerSync();setOdo(TV.hz||0);paintLevel(TS.on?TS.lvl:-90);if(TS.on)micList();
  if(!TS.raf)TS.raf=requestAnimationFrame(tunerLoop);
  const root=app.querySelector('.tun');
  const rerender=()=>{const open=[...root.querySelectorAll('.srow[open]')].map(d=>d.dataset.k),y=scrollY;tunerPage();
    open.forEach(k=>{const d=app.querySelector(`.srow[data-k="${k}"]`);if(d)d.open=true});scrollTo(0,y)};
  // note picker fills the Hz box from the current «لا»
  root.onchange=e=>{const t=e.target;
    if(t.id=='tmic'){TS.dev=t.value;store.set('tuner-mic',TS.dev);if(TS.on){tunerStop();tunerStart()}return}
    if(t.classList.contains('pn')&&t.value){const r=t.closest('.prow');r.querySelector('.ph').value=hzOf(+t.value,T.a4);
    const l=r.querySelector('.pl');if(!l.value.trim())l.value=NAMES.ar[T.acc][+t.value%12];t.value=''}};
  root.onclick=e=>{if(e.target.closest('#tlev')){const d=document.getElementById('tdbg');d.hidden=!d.hidden;if(!d.hidden&&!TS.on)d.textContent='شغّل المايك وبيطلع الفحص هنا';return}
    const b=e.target.closest('button');if(!b)return;
    if(b.id=='tgo')return TS.on?(tunerStop(),tunerSync(),document.getElementById('tmsg').textContent='وقّفت المايك'):tunerStart();
    if(b.dataset.s!=null){const i=+b.dataset.s;T.lock=T.lock===i?null:i;saveT();TS.hist=[];TS.jump=[];
      document.querySelectorAll('#tstr button').forEach((x,k)=>x.setAttribute('aria-pressed',T.lock===k));
      if(T.lock===i){const h=SS[i].hz;pluck(h);if(!TV.live){TV.tgt=Math.round(mOf(h))+T.tr}}return}
    if(b.dataset.prof){useProfile(b.dataset.prof);store.set('tuner',T);PEDIT=false;return rerender()}
    const pa=b.dataset.pa;
    if(pa){
      const p=curP();
      if(pa=='edit'){PEDIT=true;return rerender()}
      if(pa=='cancel'){PEDIT=false;return rerender()}
      if(pa=='addstr'){document.getElementById('prows').insertAdjacentHTML('beforeend',prow({l:'',hz:''},document.querySelectorAll('.prow').length));return}
      if(pa=='rm'){b.closest('.prow').remove();return}
      if(pa=='save'){
        const rows=[...document.querySelectorAll('.prow')].map(r=>({l:r.querySelector('.pl').value.trim()||'وتر',hz:Math.round(+r.querySelector('.ph').value*10)/10})).filter(s=>s.hz>=20&&s.hz<=2000);
        if(!rows.length){b.textContent='أضف وتر واحد على الأقل';return}
        p.name=(document.getElementById('pname').value.trim()||p.name).slice(0,40);p.str=rows;saveProfiles();PEDIT=false;T.lock=null;return rerender()}
      if(pa=='new'||pa=='dup'){
        const base=pa=='dup'?JSON.parse(JSON.stringify(p)):{name:'بروفايل جديد',a4:440,tol:5,names:'ar',order:'lh',acc:'f',temp:'equal',tkey:0,tr:0,str:[{l:'',hz:''}]};
        base.id='p'+Date.now().toString(36);if(pa=='dup')base.name=p.name+' (نسخة)';
        PROFILES.push(base);saveProfiles();useProfile(base.id);store.set('tuner',T);PEDIT=true;return rerender()}
      if(pa=='del'){if(!confirm('أحذف بروفايل «'+p.name+'»؟'))return;PROFILES=PROFILES.filter(x=>x!==p);saveProfiles();useProfile(PROFILES[0].id);store.set('tuner',T);PEDIT=false;return rerender()}
      if(pa=='reset'){if(!confirm('أرجّع البروفايلات الأصلية؟ أي بروفايل أضفته أو عدّلته بيروح.'))return;PROFILES=JSON.parse(JSON.stringify(DEF_PROFILES));saveProfiles();useProfile('mustaqbal');store.set('tuner',T);PEDIT=false;return rerender()}
    }
    if(b.dataset.a4){T.a4=b.dataset.a4=='reset'?440:Math.round(Math.max(390,Math.min(500,T.a4+ +b.dataset.a4))*10)/10;saveT();
      document.getElementById('a4v').textContent=T.a4.toFixed(1);document.getElementById('tv-a4').textContent=setVal().a4;return}
    if(b.dataset.tr){T.tr=b.dataset.tr=='0'?0:Math.max(-12,Math.min(12,T.tr+ +b.dataset.tr));saveT();
      document.getElementById('trv').textContent=setVal().tr;document.getElementById('tv-tr').textContent=setVal().tr;return}
    if(b.dataset.set){const k=b.dataset.set;let v=b.dataset.v;if(k=='tol'||k=='tkey')v=+v;T[k]=v;saveT();return rerender()}
  };
}

// play mode counts as practice once it lasts a minute (the metronome already logs its own time)
let playT=null,playS=null;
function playLog(s,on){
  if(on){playT=Date.now();playS=s;return}
  if(playT&&playS){const mins=(Date.now()-playT)/60000;
    if(mins>=1){logSong(sk(playS),mins);if(!E.on){const log=store.get('rz-log',{}),d=today();log[d]=(log[d]||0)+mins;store.set('rz-log',log)}}}
  playT=null;playS=null;
}
function route(){
  if(document.body.classList.contains('play'))playLog(null,false);
  document.body.classList.remove('play');if(!E.on)setWake(false);
  const h=decodeURIComponent(location.hash.slice(1));
  const q=document.getElementById('q');
  if(h!=='t'&&TS.on)tunerStop();
  if(h==='t'){q.value='';tunerPage()}
  else if(h==='r'){q.value='';rhythmPage()}
  else if(h==='me'){q.value='';mePage()}
  else if(h.startsWith('s-')&&byId(h.slice(2))){q.value='';song(byId(h.slice(2)))}
  else if(h.startsWith('a-')&&artistById(h.slice(2))){q.value='';artist(artistById(h.slice(2)))}
  else home(q.value);
  document.getElementById('mini').classList.toggle('show',E.on&&h!=='r');syncTempoUI();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
let t;document.getElementById('q').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{if(location.hash&&location.hash!=='#'){history.replaceState(null,'',location.pathname+location.search)}home(e.target.value)},120)});
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';store.set('theme',r.dataset.theme)};
(()=>{const th=store.get('theme',null);if(th)document.documentElement.dataset.theme=th})();
route();
</script>
