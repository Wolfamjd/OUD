<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F0E2">
<title>نوتات العود</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a calm honey music-stand. Sticky bar, artist shelves on the home view, one song per view with notes flowing in columns on wide screens. */
:root{
  --bg:#F8F0E2; --surface:#FFF9EF; --card:#F1E0C1; --line:#E0C697; --line-soft:#EBDABA;
  --honey:#D9A23D; --honey-ink:#3B2410; --caramel:#B3722F; --deep:#7A461A;
  --ink:#3D2715; --soft:#86674A; --focus:#B3722F;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --notes:19px; --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1510; --surface:#251D16; --card:#30251B; --line:#4B3A29; --line-soft:#3A2D20;
  --honey:#DDA94D; --honey-ink:#24170A; --caramel:#D49655; --deep:#F0C27F;
  --ink:#F2E5D0; --soft:#B59B7D; --focus:#E8B66A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1510; --surface:#251D16; --card:#30251B; --line:#4B3A29; --line-soft:#3A2D20;
  --honey:#DDA94D; --honey-ink:#24170A; --caramel:#D49655; --deep:#F0C27F;
  --ink:#F2E5D0; --soft:#B59B7D; --focus:#E8B66A; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.6;direction:rtl;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:700;color:var(--deep);letter-spacing:0}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:42px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:0 42px 0 16px;font-size:15.5px}
.search input::placeholder{color:var(--soft)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--soft);pointer-events:none}
.iconbtn{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:19px;height:19px}

/* home */
.hero{padding-block:28px 6px}
.hero h1{font-family:var(--f-display);font-size:clamp(30px,6vw,46px);line-height:1.15;margin:0;color:var(--deep);font-weight:700;text-wrap:balance}
.hero p{margin:6px 0 0;color:var(--soft);font-size:16px;max-width:60ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-block:18px 4px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;text-decoration:none;font-weight:500;font-size:15px}
.chip span{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--caramel)}
.shelf{padding-block:22px 6px}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--honey);padding-bottom:8px;margin-bottom:12px}
.shelf-head h2{font-family:var(--f-display);font-size:26px;margin:0;color:var(--deep);font-weight:700}
.shelf-head a{font-size:14px;color:var(--caramel);text-decoration:none;font-weight:500;white-space:nowrap}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.song{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line-soft);text-decoration:none;min-width:0;transition:border-color .15s,transform .15s}
.song:hover{border-color:var(--caramel)}
.song .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px;color:var(--deep);font-weight:700;font-variant-numeric:tabular-nums}
.song .t{min-width:0;flex:1}
.song .t b{display:block;font-size:16.5px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.song .t small{display:block;color:var(--soft);font-size:13px}
.empty{color:var(--soft);padding:30px 0;text-align:center}
.legend{margin-block:26px 40px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:4px 16px}
.legend summary{cursor:pointer;font-weight:700;color:var(--deep);padding-block:10px;list-style-position:inside}
.legend ul{margin:0 0 14px;padding:0 18px 0 0;display:grid;gap:8px}
.legend li{line-height:1.9}
.foot{color:var(--soft);font-size:13px;padding-block:8px 34px}

/* song view */
.crumb{display:flex;align-items:center;gap:8px;padding-block:16px 2px;font-size:14px;color:var(--soft);flex-wrap:wrap}
.crumb a{color:var(--caramel);text-decoration:none;font-weight:500}
.s-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;border-bottom:2px solid var(--honey);padding-bottom:10px}
.s-head h1{font-family:var(--f-display);font-size:clamp(30px,6vw,44px);margin:0;line-height:1.2;color:var(--deep);font-weight:700;text-wrap:balance}
.s-head .who{color:var(--soft);font-size:16px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool{height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.tool[aria-pressed="true"]{background:var(--honey);border-color:var(--caramel);color:var(--honey-ink)}
.tool svg{width:18px;height:18px}
.maqam{margin-top:14px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:8px 22px;align-items:center;background:var(--card);border-radius:var(--radius);padding:14px 16px}
.maqam b{font-size:19px;color:var(--deep);font-family:var(--f-display);font-weight:700}
.maqam .src{display:block;font-size:12.5px;color:var(--soft)}
.maqam p{margin:8px 0 0;font-size:14px;color:var(--soft)}
.scale{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.scale span{min-width:34px;height:32px;padding:0 8px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.scale span.t{background:var(--caramel);border-color:var(--caramel);color:var(--surface)}
.scale span.p{border-style:dashed;color:var(--soft)}
.scale sup,.nt sup{font-size:.6em;color:var(--caramel);margin-inline-start:1px}
.scale span.t sup{color:inherit}
.fbbox{overflow-x:auto;min-width:0}
.fb{display:block;width:100%;min-width:420px;max-width:640px;height:auto}
.fb .wood{fill:var(--line-soft)} .fb .fret{stroke:var(--line);stroke-dasharray:4 4;stroke-width:1.5}
.fb .nut,.fb .str{fill:var(--deep);stroke:var(--deep)} .fb .lbl{fill:var(--soft);font-family:var(--f-body)}
.fb .dot{fill:var(--surface);stroke:var(--caramel);stroke-width:1.6} .fb .dot.t{fill:var(--caramel)} .fb .dot.p{stroke-dasharray:3 3}
.fb .dt{fill:var(--ink);font-weight:700;font-family:var(--f-body)} .fb .dt.t{fill:var(--surface)}
.note-plain{font-size:14px;color:var(--soft);margin-top:12px}

.sheet{margin-top:18px;font-size:var(--notes);column-gap:34px;column-rule:1.5px dashed var(--line)}
.sheet.cols2{column-count:2}
.blk{margin-bottom:1.15em}
.blk h3{break-after:avoid;margin:0 0 .35em;font-size:.72em;color:var(--caramel);font-weight:700;display:flex;align-items:center;gap:8px}
.blk h3::after{content:"";flex:1;height:1px;background:var(--line)}
.blk h3 small{font-weight:400;color:var(--soft)}
.blk.sep{border-top:1px solid var(--line);padding-top:.55em}
.row{break-inside:avoid;margin-bottom:.38em}
.meta{font-size:.66em;line-height:1.35;color:var(--soft)}
.meta .cue{color:var(--caramel);font-weight:700;margin-inline-end:6px}
.nl{font-weight:700;line-height:1.75;display:flex;flex-wrap:wrap;gap:.08em .42em;align-items:center}
.nt{white-space:nowrap}
.nt.lg{background:var(--honey);color:var(--honey-ink);border-radius:.3em;padding:0 .38em}
.nt.lg sup{color:inherit}
.nt.lo{text-decoration:underline;text-decoration-color:var(--caramel);text-decoration-thickness:2.5px;text-underline-offset:5px}
.nt.hi{text-decoration:overline;text-decoration-color:var(--caramel);text-decoration-thickness:2.5px}
.lab{font-size:.62em;background:var(--caramel);color:var(--surface);border-radius:5px;padding:.1em .55em;font-weight:700}
.x{font-size:.7em;color:var(--caramel)}
.rep{break-inside:avoid;font-size:.72em;background:var(--card);color:var(--deep);border-radius:9px;padding:.35em .8em;display:inline-flex;gap:6px;align-items:center;margin-bottom:.5em}
.tipnote{margin-top:6px;border-right:3px solid var(--honey);padding:4px 12px;color:var(--soft);font-size:14.5px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:24px 40px}
.pager a{display:block;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--line-soft);background:var(--surface);text-decoration:none;min-width:0}
.pager a small{display:block;color:var(--soft);font-size:12.5px}
.pager a b{display:block;overflow-wrap:anywhere}
.pager .nx{text-align:left}

/* play mode: only the notes, big, screen kept awake */
body.play .bar,body.play .crumb,body.play .maqam,body.play .pager,body.play .tipnote{display:none}
body.play .s-head h1{font-size:26px}
body.play .s-head{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:8px}

@media (min-width:820px){ .sheet.auto{column-count:2} }
@media (max-width:700px){
  .maqam{grid-template-columns:minmax(0,1fr)}
  .brand b{display:none}
  .pager{grid-template-columns:minmax(0,1fr)}
  .pager .nx{text-align:right}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>

</div></header>

function split(tok){let a='';if(tok.endsWith('#½')){a='½♯';tok=tok.slice(0,-2)}else if(tok.endsWith('½')){a='½♭';tok=tok.slice(0,-1)}else if(tok.endsWith('b')){a='♭';tok=tok.slice(0,-1)}else if(tok.endsWith('#')){a='♯';tok=tok.slice(0,-1)}return [AR[tok]||tok,a]}
const noteName=t=>{const [n,a]=split(t);return `${n}${a?`<sup>${a}</sup>`:''}`};

function fretboard(fb){
  const NUT=585,STEP=118,Y0=32,DY=38,OPEN=['فا','لا','ري','صول','دو'];
  const X=f=>f==0?NUT+32:NUT-f*STEP+STEP/2-6, Y=n=>Y0+(n-1)*DY;
  let o=`<svg class="fb" viewBox="30 0 690 232" role="img" aria-label="أماكن نغمات المقام على أوتار العود">`;
  o+=`<rect class="wood" x="40" y="${Y0-16}" width="${NUT-40}" height="${4*DY+32}" rx="8"/>`;
  for(let f=1;f<=4;f++){const x=NUT-f*STEP;o+=`<line class="fret" x1="${x}" y1="${Y0-16}" x2="${x}" y2="${Y0+4*DY+16}"/><text class="lbl" x="${x+STEP/2-6}" y="${Y0+4*DY+40}" text-anchor="middle" font-size="17">موضع ${f}</text>`}
  o+=`<rect class="nut" x="${NUT-4}" y="${Y0-18}" width="8" height="${4*DY+36}" rx="3"/><text class="lbl" x="${NUT+30}" y="${Y0+4*DY+40}" text-anchor="middle" font-size="17">مفتوح</text>`;
  for(let n=1;n<=5;n++){o+=`<line class="str" x1="40" y1="${Y(n)}" x2="${NUT+52}" y2="${Y(n)}" stroke-width="${3.4-n*0.45}"/><text class="lbl" x="${NUT+132}" y="${Y(n)+6}" font-size="17" text-anchor="start" direction="rtl">وتر ${n} · ${OPEN[n-1]}</text>`}
  fb.forEach(([n,f,tok,k])=>{const [t,a]=split(tok);const c=k=='t'?' t':k=='p'?' p':'';
    o+=`<circle class="dot${c}" cx="${X(f)}" cy="${Y(n)}" r="17.5"/><text class="dt${k=='t'?' t':''}" x="${X(f)}" y="${Y(n)+5.5}" text-anchor="middle" font-size="${a?13:t=='صول'?14:17}" direction="rtl">${t}${a}</text>`});
  return o+`</svg>`;
}

function rowHtml(r){
  let meta='';

  const notes=(r.items||[]).map(i=>{
    if(i.t=='label')return `<span class="lab">${esc(i.v)}</span>`;
    if(i.t=='rep')return `<span class="x">× ${esc(i.v||2)}</span>`;
    if(i.t=='rest')return `<span class="x">(سكتة)</span>`;
    const c=['nt',i.l?'lg':'',i.o=='low'?'lo':i.o=='high'?'hi':''].filter(Boolean).join(' ');
    return `<span class="${c}">${esc(i.n)}${i.a?`<sup>${esc(i.a)}</sup>`:''}</span>`;
  }).join('');
  if(!meta&&!notes)return '';
  return `<div class="row">${meta?`<div class="meta">${meta}</div>`:''}${notes?`<div class="nl">${notes}</div>`:''}</div>`;
}
function sheetHtml(s){
  return s.blocks.map((b,k)=>{
    if(b.repeat)return `<div class="blk"><span class="rep">↻ أعد المقطع: ${esc(b.repeat)}</span></div>`;
    const head=b.name?`<h3>${esc(b.name)}${b.note?` <small>${esc(b.note)}</small>`:''}</h3>`:'';
    return `<div class="blk${!b.name&&k?' sep':''}">${head}${b.rows.map(rowHtml).join('')}</div>`;
  }).join('');
}

const maqLine=s=>s.maqam?s.maqam.name:'المقام غير مذكور';
function songCard(s,n){
  return `<a class="song" href="#s-${s.id}"><span class="n">${n}</span><span class="t"><b>${esc(s.title)}${s.sub?` <small style="display:inline;font-weight:400">· ${esc(s.sub)}</small>`:''}</b><small>${esc(maqLine(s))}</small></span></a>`;
}
const LEGEND=`<details class="legend" id="legend"><summary>كيف أقرأ النوتة؟</summary><ul>
 <li>اقرأ من اليمين إلى اليسار، سطراً بسطر. على الآيباد والكمبيوتر العمود اليمين قبل اليسار.</li>
 <li><span class="nt lg">فا</span> نغمة ممدودة · <span class="nt lo">دو</span> قرار (خط تحتها) · <span class="nt hi">ري</span> جواب (خط فوقها) · <span class="lab">لازمة</span> ردّ موسيقي قصير</li>
 <li>♭ بيمول · ♯ دييز · ½♭ نصف بيمول (ربع تون) · ½♯ نصف دييز · ♮ طبيعية</li>
 <li><span style="color:var(--caramel);font-weight:700">الكلمة الكراميل</span> أول كلمتين من المقطع لتعرف مكانك، و«↻ أعد المقطع» يعني نغمات مقطع سبق.</li>
 <li>رسم الزند بنفس منظر فيديوهات «عود ثري دي»: المفاتيح يمين والوتر الغليظ فوق، وكل «موضع» نصف تون.</li>
</ul></details>`;

const app=document.getElementById('app');
function home(q){
  const total=SONGS.length;
  let h=`<section class="hero"><h1>نوتات العود</h1><p>${total} أغنية لـ${DATA.artists.length} فنانين، مكتوبة بأسماء النغمات مع مقام كل أغنية وأماكنها على الأوتار.</p></section>`;
  if(q){
    const n=q.trim().replace(/[إأآ]/g,'ا').replace(/ة/g,'ه');
    const norm=t=>String(t).replace(/[إأآ]/g,'ا').replace(/ة/g,'ه');
    const hits=SONGS.filter(s=>norm(s.title+' '+s.artist+' '+maqLine(s)+' '+(s.sub||'')).includes(n));
    h+=`<section class="shelf"><div class="shelf-head"><h2>نتائج البحث</h2><span style="color:var(--soft)">${hits.length}</span></div>${hits.length?`<div class="songs">${hits.map((s,i)=>songCard(s,i+1).replace('</small></span>',' · '+esc(s.artist)+'</small></span>')).join('')}</div>`:`<p class="empty">ما فيه أغنية بهذا الاسم. جرّب اسم الفنان أو المقام.</p>`}</section>`;
  }else{
    h+=`<nav class="chips" aria-label="الفنانون">${DATA.artists.map(a=>`<a class="chip" href="#a-${a.id}">${esc(a.name)} <span>${a.songs.length}</span></a>`).join('')}</nav>`;
    h+=DATA.artists.map(a=>`<section class="shelf"><div class="shelf-head"><h2>${esc(a.name)}</h2><a href="#a-${a.id}">${a.songs.length} ${a.songs.length>2&&a.songs.length<11?'أغاني':'أغنية'} ←</a></div><div class="songs">${a.songs.map((s,i)=>songCard(s,i+1)).join('')}</div></section>`).join('');
  }
  h+=LEGEND+`<p class="foot">المصادر: قنوات «نوتات» لعبادي الجوهر ومحمد عبده وطلال مداح على تلقرام، ودروس «عود ثري دي». الكلمات غير منسوخة، تظهر فقط أول كلمتين من كل مقطع.</p>`;
  app.innerHTML=h;document.title='نوتات العود';
}
function artist(a){
  app.innerHTML=`<div class="crumb"><a href="#">الرئيسية</a> ‹ <span>${esc(a.name)}</span></div>
  <section class="shelf" style="padding-top:8px"><div class="shelf-head"><h2 style="font-size:clamp(28px,5vw,40px)">${esc(a.name)}</h2><span style="color:var(--soft)">${a.songs.length} أغنية</span></div>
  <div class="songs">${a.songs.map((s,i)=>songCard(s,i+1)).join('')}</div></section>`+LEGEND;
  document.title=a.name+' · نوتات العود';
}
let wake=null;
async function setWake(on){try{if(on&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&document.body.classList.contains('play'))setWake(true)});

function song(s){
  const a=artistById(s.artistId);const m=s.maqam;
  const prev=a.songs[s.idx-1],next=a.songs[s.idx+1];
  const fs=store.get('notes-size',19),cols=store.get('cols','auto');
  let mq='';
  if(m&&m.scale&&m.scale.length){
    mq=`<section class="maqam" aria-label="المقام"><div><b>${esc(m.name)}</b>${m.src?`<span class="src">${esc(m.src)}</span>`:''}
      <div class="scale">${m.scale.map((t,k)=>`<span class="${k==0||k==m.scale.length-1?'t':''}">${noteName(t)}</span>`).join('')}${(m.pass||[]).map(t=>`<span class="p">${noteName(t)}</span>`).join('')}</div>
      ${s.mood?`<p>${esc(s.mood)}</p>`:''}</div><div class="fbbox">${fretboard(m.fb)}</div></section>`;
  }else mq=`<p class="note-plain">${m?esc(m.name):'المقام غير مذكور في المصدر.'}</p>`;
  app.innerHTML=`<div class="crumb"><a href="#">الرئيسية</a> ‹ <a href="#a-${a.id}">${esc(a.name)}</a></div>
  <div class="s-head"><div><h1>${esc(s.title)}</h1><div class="who">${esc(a.name)}${s.sub?' · '+esc(s.sub):''}</div></div>
   <div class="tools" role="toolbar" aria-label="أدوات العرض">
    <button class="tool" id="smaller" type="button" aria-label="تصغير الخط">أ−</button>
    <button class="tool" id="bigger" type="button" aria-label="تكبير الخط">أ+</button>
    <button class="tool" id="cols" type="button" aria-pressed="${cols==='one'?'false':'true'}" aria-label="عمودان على الشاشات العريضة">عمودان</button>
    <button class="tool" id="play" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>وضع العزف</button>
   </div></div>
  ${mq}
  <article class="sheet ${cols==='one'?'':'auto'}" id="sheet" style="--notes:${fs}px">${sheetHtml(s)}</article>
  ${s.tip?`<p class="tipnote">${esc(s.tip)}</p>`:''}
  <p class="foot" style="padding-bottom:0">المصدر: ${esc(s.source)}</p>
  <nav class="pager">${prev?`<a href="#s-${prev.id}"><small>→ السابقة</small><b>${esc(prev.title)}</b></a>`:'<span></span>'}${next?`<a class="nx" href="#s-${next.id}"><small>التالية ←</small><b>${esc(next.title)}</b></a>`:'<span></span>'}</nav>`;
  document.title=s.title+' · نوتات العود';
  const sheet=document.getElementById('sheet');
  const size=d=>{let v=Math.min(34,Math.max(14,store.get('notes-size',19)+d));store.set('notes-size',v);sheet.style.setProperty('--notes',v+'px')};
  document.getElementById('smaller').onclick=()=>size(-2);
  document.getElementById('bigger').onclick=()=>size(2);
  document.getElementById('cols').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);sheet.classList.toggle('auto',on);store.set('cols',on?'auto':'one')};
  document.getElementById('play').onclick=e=>{const on=!document.body.classList.contains('play');document.body.classList.toggle('play',on);e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.lastChild.textContent=on?'إنهاء العزف':'وضع العزف';setWake(on);window.scrollTo(0,0)};
}

function route(){
  document.body.classList.remove('play');setWake(false);
  const h=decodeURIComponent(location.hash.slice(1));
  const q=document.getElementById('q');
  if(h.startsWith('s-')&&byId(h.slice(2))){q.value='';song(byId(h.slice(2)))}
  else if(h.startsWith('a-')&&artistById(h.slice(2))){q.value='';artist(artistById(h.slice(2)))}
  else home(q.value);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
let t;document.getElementById('q').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{if(location.hash&&location.hash!=='#'){history.replaceState(null,'',location.pathname+location.search)}home(e.target.value)},120)});
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';store.set('theme',r.dataset.theme)};
(()=>{const th=store.get('theme',null);if(th)document.documentElement.dataset.theme=th})();
route();
</script>

</body>
</html>
